[project]
name = "fiery-namedtensors"
authors = [
    {name = "Yael Balbastre", email = "y.balbastre@ucl.ac.uk"},
]
maintainers = [
    {name = "Yael Balbastre", email = "y.balbastre@ucl.ac.uk"},
]
description = "Named dimensions and named indices for PyTorch tensors"
readme = "README.md"
license = {text = "MIT"}
keywords = [
    "fiery",
    "pytorch",
    "torch",
    "named tensors",
    "named dimensions",
    "named indices",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dynamic = ["version"]
# The named-tensor subclassing relies on `__torch_function__` (torch >= 1.5)
# and `torch.broadcast_shapes` (torch >= 1.8). Python floor is 3.7: the code
# uses only old-compatible runtime syntax plus `typing_extensions`.
requires-python = ">=3.7"
dependencies = [
    "torch>=1.8",
    "typing_extensions>=4.0",
]

[project.urls]
Homepage = "https://github.com/bagofseeds/fiery-namedtensors"
Documentation = "https://bagofseeds.github.io/fiery-namedtensors/"
Issues = "https://github.com/bagofseeds/fiery-namedtensors/issues"
Repository = "https://github.com/bagofseeds/fiery-namedtensors"

[project.optional-dependencies]
test = [
    "pytest>=7",
    "numpy",
]

[build-system]
requires = [
    "setuptools>=59.0",
    "wheel",
    "versioningit>=1.0",
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["fiery*"]
namespaces = true

[tool.versioningit]
default-version = "0+unknown"

[tool.versioningit.vcs]
default-tag = "0.1"

[tool.versioningit.format]
distance = "{base_version}+{distance}.{vcs}{rev}"
dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"
distance-dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"

[tool.versioningit.write]
file = "src/fiery/namedtensors/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
omit = ["src/fiery/namedtensors/_version.py"]

[tool.ruff]
line-length = 79
extend-exclude = ["docs/examples"]

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "W"]
ignore = [
    "B905",   # zip(strict=...) requires Python >= 3.10
    "B007",   # allow unused loop variables
    "E731",   # allow assigning lambdas to variables
]

[tool.codespell]
check-filenames = true
skip = ".git,*.egg-info,build,dist,*.pdf,*.svg,*.ipynb"
