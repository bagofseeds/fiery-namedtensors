[project]
name = "fiery-xtensor"
authors = [
    {name = "Yael Balbastre", email = "y.balbastre@ucl.ac.uk"},
]
maintainers = [
    {name = "Yael Balbastre", email = "y.balbastre@ucl.ac.uk"},
]
description = "xarray-like named dimensions and coordinate labels for PyTorch tensors"
readme = "README.md"
license = {text = "MIT"}
keywords = [
    "fiery",
    "pytorch",
    "torch",
    "xarray",
    "named tensors",
    "named dimensions",
    "coordinates",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dynamic = ["version"]
# The named-tensor subclassing needs tensor-subclass `__torch_function__`
# support and `Tensor.as_subclass` (both torch >= 1.7), plus the
# `torch._C.DisableTorchFunction` guard used by `_compat` (also >= 1.7). Shape
# broadcasting is implemented in-package (`_compat.broadcast_shape`), so it is
# NOT a floor constraint. Tested floor is torch 1.7 / Python 3.7; a handful of
# ops added in 1.8 (`swapaxes`/`swapdims`/`moveaxis`/`broadcast_to`) are simply
# absent under 1.7 (registered only when present). The code uses only
# old-compatible runtime syntax plus `typing_extensions`. Upper bound is the
# last release that ships the builtin named-tensor API (`.names` / `.rename`);
# supporting newer torch is tracked (self-managed axis names).
requires-python = ">=3.7"
dependencies = [
    "torch>=1.7",
    "typing_extensions>=4.0",
]

[project.urls]
Homepage = "https://github.com/bagofseeds/fiery-xtensor"
Documentation = "https://bagofseeds.github.io/fiery-xtensor/"
Issues = "https://github.com/bagofseeds/fiery-xtensor/issues"
Repository = "https://github.com/bagofseeds/fiery-xtensor"

[project.optional-dependencies]
# Physical-unit backend for data units (Proposal 0003). Optional: without it a
# `.unit` is an opaque string. pint needs Python >= 3.8.
units = [
    "pint>=0.18",
]
test = [
    "pytest>=7",
    "numpy",
    # exercise the unit backend where pint is installable (py >= 3.9)
    "pint>=0.18; python_version >= '3.9'",
]

[build-system]
requires = [
    "setuptools>=59.0",
    "wheel",
    "versioningit>=1.0",
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["fiery*"]
namespaces = true

[tool.versioningit]
default-version = "0+unknown"

[tool.versioningit.vcs]
default-tag = "0.1"

[tool.versioningit.format]
distance = "{base_version}+{distance}.{vcs}{rev}"
dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"
distance-dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"

[tool.versioningit.write]
file = "src/fiery/xtensor/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
omit = ["src/fiery/xtensor/_version.py"]

[tool.ruff]
line-length = 79
extend-exclude = ["docs/examples"]

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "W"]
ignore = [
    "B905",   # zip(strict=...) requires Python >= 3.10
    "B007",   # allow unused loop variables
    "E731",   # allow assigning lambdas to variables
]

[tool.codespell]
check-filenames = true
skip = ".git,*.egg-info,build,dist,*.pdf,*.svg,*.ipynb"
