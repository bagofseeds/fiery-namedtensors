name: Probe old torch (< 1.8)

# Answers issue #6: does the package run on torch < 1.8 (the current CI floor)?
# GitHub's runners can reach download.pytorch.org (where the old CPU wheels
# live), so this fetches an old torch, puts the package on PYTHONPATH (no build,
# no dep-resolution, so the pinned torch is not upgraded past pyproject's
# `torch>=1.8`), and runs the suite. Informational only -- it is NOT part of the
# gating test matrix, and runs on manual dispatch or on a push to this branch.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/probe-old-torch

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.8"
            torch: "torch==1.7.1+cpu"
            numpy: "numpy==1.21.6"
          - python-version: "3.8"
            torch: "torch==1.6.0+cpu"
            numpy: "numpy==1.19.5"
    name: "torch ${{ matrix.torch }} (py${{ matrix.python-version }})"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install old torch + test deps
        run: |
          python -m pip install --upgrade pip
          pip install ${{ matrix.torch }} ${{ matrix.numpy }} \
            -f https://download.pytorch.org/whl/torch_stable.html
          pip install "pytest>=7" "typing_extensions>=4.0"

      - name: Show versions
        run: |
          python -c "import sys, torch, numpy; \
            print('python', sys.version.split()[0]); \
            print('torch', torch.__version__); \
            print('numpy', numpy.__version__)"

      - name: Run the suite (package on PYTHONPATH, no build)
        env:
          PYTHONPATH: src
        run: pytest -q
