[project]

extra_css = ["stylesheets/extra.css"]

nav = [
  {"Fiery" = "https://bagofseeds.github.io/fiery/"},
  {"XTensor" = [
    "index.md",
    {"Names & dimensions" = "guide/names.md"},
    {"Coordinates" = "guide/coordinates.md"},
    {"Broadcasting & alignment" = "guide/broadcasting.md"},
    {"Axis descriptors" = "guide/descriptors.md"},
    {"Data units" = "guide/data-units.md"},
    {"Differences from xarray" = "guide/vs-xarray.md"},
  ]},
  {"API" = [
    "api/index.md",
    {"Core" = "api/core.md"},
    {"Factories" = "api/factories.md"},
    {"Reductions" = "api/reductions.md"},
    {"Combining" = "api/combining.md"},
    {"Pointwise operations" = "api/pointwise.md"},
    {"Gather, scatter & indexing" = "api/indexing.md"},
    {"Shape" = "api/shape.md"},
    {"Data units" = "api/units.md"},
    {"Options" = "api/options.md"},
  ]},
  {"Proposals" = [
    "proposals/index.md",
    {"0001 — Coordinates (values, spacing, units)" = "proposals/0001-units.md"},
    {"0002 — Structured coordinates" = "proposals/0002-structured-coordinates.md"},
    {"0003 — Data units" = "proposals/0003-data-units.md"},
    {"0004 — Numeric coordinate selection" = "proposals/0004-numeric-selection.md"},
    {"0005 — Multiple coordinates per axis" = "proposals/0005-multiple-coordinates.md"},
    {"0006 — A pint.Quantity-shaped API" = "proposals/0006-quantity-api.md"},
  ]},
]

# The site_name is shown in the page header and the browser window title
#
# Read more: https://zensical.org/docs/setup/basics/#site_name
site_name = "fiery-xtensor"

site_description = "xarray-like named dimensions and coordinate labels for PyTorch tensors."

# The site_author attribute. This is used in the HTML head element.
#
# Read more: https://zensical.org/docs/setup/basics/#site_author
site_author = "Yael Balbastre"

site_url = "https://bagofseeds.github.io/fiery-xtensor/"
repo_url = "https://github.com/bagofseeds/fiery-xtensor"
repo_name = "bagofseeds/fiery-xtensor"

copyright = """
Copyright &copy; 2026 The authors
"""

[project.theme]

language = "en"

features = [
  "content.code.copy",
  "content.code.select",
  "navigation.indexes",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# ----------------------------------------------------------------------------
# Logo & icons
# ----------------------------------------------------------------------------
[project.theme.icon]
logo =  "material/fire"
repo = "fontawesome/brands/github"

# ----------------------------------------------------------------------------
# mkdocstrings
# ----------------------------------------------------------------------------
[project.plugins.mkdocstrings.handlers.python]
inventories = [
  "https://docs.python.org/3/objects.inv",
  "https://pytorch.org/docs/stable/objects.inv",
]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
extensions = ["docs/griffe_ext.py"]
docstring_style = "numpy"
inherited_members = false
show_source = false
merge_init_into_class = true
separate_signature = true
members_order = "source"
show_root_heading = true
show_overloads = true
overloads_only = true
relative_crossrefs = true
scoped_crossrefs = true
show_if_no_docstring = false
allow_inspection = true
filters = "public"
group_by_category = true
show_category_heading = true
modernize_annotations = true
show_signature_annotations = true
signature_crossrefs = true

# ----------------------------------------------------------------------------
# Markdown extras
# ----------------------------------------------------------------------------
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.snippets]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.tables]
[project.markdown_extensions.markdown_grid_tables]
[project.markdown_extensions.toc]
toc_depth = 3
